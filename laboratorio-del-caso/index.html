<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5faf9">
<title>Il laboratorio del caso — Monte Carlo e compleanni</title>
<style>
:root {--ink:#193f3b;--muted:#637b83;--bg:#f7fbfa;--surface:#fff;--teal:#0b9688;--teal2:#11b79d;--cream:#fff7e8;--orange:#ffb444;--blue:#4786ce;--red:#fa927c;--border:#d9e8e6;--shadow:0 18px 50px #184d4714;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}a{color:var(--teal)}.app{max-width:1500px;min-height:100vh;padding:18px 34px 24px;margin:auto;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 4px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.025em;color:var(--ink)}.brand-mark{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#dff6ed;color:var(--teal);font-size:22px}.tag{font-size:12px;font-weight:800;color:#087e75;text-transform:uppercase;letter-spacing:.11em}.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}.screen{background:var(--surface);border-radius:28px;border:1px solid var(--border);box-shadow:var(--shadow);padding:clamp(24px,3vw,46px);min-height:630px;flex:1;display:flex;flex-direction:column;overflow:hidden}.slide-head{margin-bottom:22px}.eyebrow{font-size:14px;color:var(--teal);font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}.slide-head h1{font-size:clamp(34px,4vw,62px);line-height:1.1;margin:0;letter-spacing:-.045em}.slide-head p{font-size:clamp(18px,1.5vw,23px);color:var(--muted);margin:13px 0 0;line-height:1.45}.slide-body{flex:1}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;height:100%}.hero h1{font-size:clamp(54px,6vw,90px);line-height:1.03;letter-spacing:-.055em;margin:18px 0 20px}.hero p{font-size:clamp(20px,1.8vw,27px);line-height:1.48;color:var(--muted);margin-bottom:30px}.hero-art{min-height:390px;border-radius:26px;background:linear-gradient(140deg,#f0faf8,#d9f4f1);position:relative;display:grid;place-items:center;overflow:hidden}.hero-art .big-circle{height:min(28vw,350px);width:min(28vw,350px);border-radius:50%;border:8px solid #20ac96;background:radial-gradient(circle at 30% 26%,#e9fffb 0,#beece0 85%);position:relative}.hero-art .big-circle:after{content:'π';position:absolute;inset:0;display:grid;place-items:center;font-size:150px;color:#0e897c;font-weight:750}.art-dot{position:absolute;border-radius:50%;background:#ffb649}.dot1{height:26px;width:26px;top:10%;left:14%}.dot2{height:18px;width:18px;bottom:14%;right:11%}.dot3{height:13px;width:13px;top:23%;right:17%}.primary{border:0;background:var(--teal);color:white;border-radius:14px;padding:13px 25px;font-weight:800;font-size:17px;box-shadow:0 5px 12px #0b968825}.primary:hover{background:#087d73}.secondary{border:1px solid #c8e3de;background:white;color:var(--ink);border-radius:12px;padding:11px 17px;font-weight:750}.secondary:hover,.secondary.active{background:#e4f6f1;border-color:#84cdbf}.warm{background:var(--cream);border-left:6px solid var(--orange);padding:17px 22px;border-radius:16px;color:#60481f}.stat{border:1px solid var(--border);border-radius:16px;background:#f9fcfb;padding:16px 20px;min-width:150px}.stat-label{font-weight:700;font-size:14px;color:var(--muted)}.stat-value{font-size:clamp(24px,2.5vw,38px);font-weight:850;line-height:1.3;letter-spacing:-.04em;color:#154e45}.stats{display:flex;gap:12px;flex-wrap:wrap}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:24px;align-items:start}.panel{border:1px solid var(--border);border-radius:20px;background:#fff;padding:18px}.panel h3{font-size:20px;margin:0 0 14px}.point-panel{text-align:center;background:#f7fbfa}.point-panel canvas{display:block;margin:auto;width:min(100%,490px);height:auto;border:1px solid #bfd5d0;background:#fff;border-radius:8px}.big-num{font-size:clamp(43px,5vw,74px);font-weight:900;line-height:1.1;color:var(--teal);letter-spacing:-.06em}.subtle{color:var(--muted)}.center{text-align:center}.math{font-size:clamp(23px,2.6vw,36px);font-weight:850;text-align:center;background:#eaf8f4;border-radius:20px;padding:22px;color:#0c796c}.visual-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.big-dice{width:130px;height:130px;display:grid;place-items:center;background:#e5f7f2;border:3px solid #a4d7cb;border-radius:25px;font-size:86px}.bar-row{display:grid;grid-template-columns:24px 1fr 42px;align-items:center;gap:10px;margin:9px 0;font-size:16px;font-weight:800}.bar-track{height:20px;border-radius:30px;background:#edf3f1;overflow:hidden}.bar-fill{height:100%;border-radius:30px;background:linear-gradient(90deg,#34b3a4,#0a958a)}.illustrate-circle{position:relative;width:320px;height:320px;margin:20px auto;border:3px solid #7a9bbb;background:#eaf5fb;display:grid;place-items:center}.illustrate-circle:before{content:'';height:100%;width:100%;border-radius:50%;border:4px solid var(--teal);background:#b9eade;position:absolute}.illustrate-circle span{position:relative;font-size:44px;font-weight:900;color:#08796d}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.step{border-radius:20px;background:#f0f9f6;padding:26px;min-height:200px}.step strong{display:block;font-size:22px;margin-bottom:14px}.step p{font-size:18px;color:#496964;line-height:1.5}.question-choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:950px;margin:auto}.choice{padding:26px;border:2px solid #d7e8e3;border-radius:18px;text-align:left;background:#fff;font-size:25px;font-weight:850;color:var(--ink)}.choice:hover,.choice.selected{background:#ecf9f5;border-color:var(--teal)}.choices-info{text-align:center;min-height:42px;margin-top:23px;color:var(--teal);font-size:18px;font-weight:800}.month-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.birthday{border-radius:10px;background:#eaf6f2;padding:9px 5px;text-align:center;white-space:nowrap;font-size:12px;color:#38635b;border:1px solid #d2e6df}.birthday .avatar{display:block;font-size:22px}.birthday.duplicate{background:#fff0ba;border-color:#ebbd49;color:#674f14;font-weight:900}.slider-bar{height:20px;border-radius:100px;background:#e7f3ef;overflow:hidden;margin:20px 0 8px}.slider-fill{height:100%;background:var(--teal);min-width:0}.mini-table{width:100%;border-collapse:collapse;font-size:19px}.mini-table td,.mini-table th{padding:13px;border-bottom:1px solid #e3efec;text-align:left}.mini-table td:last-child{text-align:right;font-weight:850}.huge-pairs{font-size:clamp(66px,9vw,128px);font-weight:900;color:var(--teal);line-height:1}.challenge-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.challenge{padding:30px;border-radius:22px;background:#f2faf7;min-height:250px}.challenge h3{font-size:26px;margin:5px 0 10px}.challenge p{font-size:21px;line-height:1.55;color:#476760}.footer{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:3px 6px}.nav-actions{display:flex;gap:8px}.navbutton{border:1px solid #d4e5df;background:white;color:#234f47;border-radius:11px;padding:9px 16px;font-weight:800;font-size:17px}.navbutton:disabled{opacity:.3;cursor:not-allowed}.progress{height:7px;flex:1;max-width:400px;border-radius:20px;background:#e3efec;overflow:hidden}.progress-inner{height:100%;background:var(--teal);transition:width .2s}.fullscreen{font-size:13px;padding:8px 12px}.note{margin-top:16px;color:#657e78;font-size:15px}.splash-label{display:inline-block;background:#e1f7f0;padding:10px 16px;border-radius:99px;font-weight:850;color:#0d8073}.embed-warning{color:var(--muted);font-size:12px}.notvisible{display:none}.report{font-size:23px;line-height:1.5}
@media(max-width:1000px){.app{padding:12px}.screen{min-height:unset}.cols,.hero{grid-template-columns:1fr}.hero-art{min-height:260px}.hero-art .big-circle{height:210px;width:210px}.hero-art .big-circle:after{font-size:90px}.month-grid{grid-template-columns:repeat(4,1fr)}.question-choices,.steps,.challenge-grid{grid-template-columns:1fr}.slide-head h1{font-size:36px}}@media(max-width:600px){.screen{padding:18px;border-radius:18px}.app{gap:8px}.stat{flex:1;min-width:110px}.stat-value{font-size:24px}.cols{display:block}.cols>*{margin-bottom:14px}.month-grid{grid-template-columns:repeat(3,1fr)}.choice{font-size:20px;padding:20px}.hero h1{font-size:48px}.hero-art{display:none}.top-right .tag{display:none}}
@media print{.app{padding:0}.top,.footer{display:none}.screen{box-shadow:none;min-height:95vh;page-break-after:always}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span class="brand-mark">π</span><span>Il laboratorio del caso</span></div><div class="top-right"><span class="counter" id="counter">1 / 9</span><button class="secondary fullscreen" id="fullscreen">⛶ Schermo intero</button></div></header>
  <main class="screen" id="screen" role="region" aria-live="polite"></main>
  <footer class="footer"><div class="progress"><div class="progress-inner" id="progress" style="width:11.11%"></div></div><div class="nav-actions"><button class="navbutton" id="prev">← Indietro</button><button class="navbutton" id="next">Avanti →</button></div></footer>
</div>
<script>
'use strict';
const screenEl=document.getElementById('screen');
const state={slide:0,dice:Array(6).fill(0),lastDie:1,piPoints:[],piInside:0,piHistory:[],students:23,classes:0,duplicateClasses:0,birthdays:[],birthdayHit:false,reveal:false,choice:-1};
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=n=>new Intl.NumberFormat('it-IT').format(n);
const ratio=(a,b)=>b?100*a/b:0;
const theoretical=n=>{let probNo=1;for(let i=0;i<n;i++)probNo*=(365-i)/365;return 1-probNo;};
function panelHeader(label,title,subtitle=''){return `<header class="slide-head"><div class="eyebrow">${label}</div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</header>`;}
function drawSlide(){
 const v=[home,diceSlide,piQuestion,piExperiment,piExplained,birthdayQuestion,birthdayExperiment,birthdayExplanation,finalSlide][state.slide];
 screenEl.innerHTML=v();
 document.getElementById('counter').textContent=`${state.slide+1} / 9`;
 document.getElementById('progress').style.width=((state.slide+1)/9*100)+'%';
 document.getElementById('prev').disabled=state.slide===0;document.getElementById('next').disabled=state.slide===8;
 if(state.slide===3)paintPi();
 if(state.slide===1)paintDice();
 if(state.slide===6)paintBirthday();
}
function navigate(delta){state.slide=Math.max(0,Math.min(8,state.slide+delta));drawSlide();window.scrollTo({top:0,behavior:'instant'});}
document.getElementById('prev').addEventListener('click',()=>navigate(-1));
document.getElementById('next').addEventListener('click',()=>navigate(1));
document.getElementById('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen();}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}});
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();navigate(1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();navigate(-1);}});
function home(){return `<div class="slide-body hero"><section><span class="splash-label">Esperimenti interattivi</span><h1>Il laboratorio<br>del <span style="color:var(--teal)">caso</span></h1><p>Due sfide matematiche: stimare <strong>π</strong> e scoprire il <strong>paradosso del compleanno</strong>.</p><button class="primary" onclick="navigate(1)">Iniziamo →</button></section><div class="hero-art" aria-hidden="true"><div class="big-circle"></div><div class="art-dot dot1"></div><div class="art-dot dot2"></div><div class="art-dot dot3"></div></div></div>`;}
function diceSlide(){return `${panelHeader('Il caso in azione','Un dado, tanti lanci','Che cosa succede se lanciamo un dado molte volte?')}<div class="slide-body cols"><section><div class="panel"><div class="visual-row"><div class="big-dice" id="dieFace">⚀</div><div><div class="subtle">Ultimo risultato</div><div class="big-num" id="dieLast">1</div></div></div><div class="controls"><button class="primary" onclick="rollDice(1)">Lancia 1</button><button class="secondary" onclick="rollDice(10)">+10 lanci</button><button class="secondary" onclick="rollDice(100)">+100 lanci</button><button class="secondary" onclick="resetDice()">Ricomincia</button></div><div class="stats"><div class="stat"><div class="stat-label">Lanci effettuati</div><div class="stat-value" id="dieTotal">0</div></div></div></div></section><section class="panel"><h3>Quante volte è uscita ogni faccia?</h3><div id="dieBars"></div></section></div>`;}
function paintDice(){document.getElementById('dieLast').textContent=state.lastDie;document.getElementById('dieFace').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][state.lastDie-1];document.getElementById('dieTotal').textContent=fmt(sum(state.dice));let total=sum(state.dice);document.getElementById('dieBars').innerHTML=state.dice.map((n,i)=>`<div class="bar-row"><span>${i+1}</span><div class="bar-track"><div class="bar-fill" style="width:${ratio(n,total)}%"></div></div><span>${n}</span></div>`).join('');}
function rollDice(n){for(let i=0;i<n;i++){state.lastDie=1+Math.floor(Math.random()*6);state.dice[state.lastDie-1]++;}paintDice();}
function resetDice(){state.dice=Array(6).fill(0);state.lastDie=1;paintDice();}
function piQuestion(){return `${panelHeader('Esperimento 1','Possiamo stimare π lanciando punti a caso?','Un cerchio di raggio 1 è disegnato dentro un quadrato di lato 2.')}<div class="slide-body cols" style="align-items:center"><div class="illustrate-circle"><span>π</span></div><div><div class="panel" style="margin-bottom:20px"><h3>Il quadrato</h3><div class="big-num" style="color:var(--blue)">Area = 4</div><p class="subtle">Lato 2 × lato 2</p></div><div class="panel"><h3>Il cerchio</h3><div class="big-num">Area = π</div><p class="subtle">Per un cerchio di raggio 1</p></div></div></div>`;}
function piExperiment(){return `${panelHeader('Esperimento 1','Stimiamo π con i puntini!','Ogni punto ha la stessa possibilità di cadere ovunque nel quadrato.')}<div class="slide-body cols"><section><div class="panel point-panel"><canvas id="piCanvas" width="520" height="520" aria-label="Punti casuali nel quadrato e nel cerchio"></canvas><div class="note"><span style="color:var(--blue);font-weight:850">●</span> Dentro il cerchio &nbsp;&nbsp;<span style="color:var(--red);font-weight:850">●</span> Fuori dal cerchio</div></div></section><section><div class="controls"><button class="secondary" onclick="addPi(10)">+10 punti</button><button class="primary" onclick="addPi(100)">+100 punti</button><button class="secondary" onclick="addPi(1000)">+1.000 punti</button><button class="secondary" onclick="addPi(10000)">+10.000 punti</button><button class="secondary" onclick="resetPi()">Ricomincia</button></div><div class="stats"><div class="stat"><div class="stat-label">Punti totali</div><div class="stat-value" id="piTotal">0</div></div><div class="stat"><div class="stat-label">Punti nel cerchio</div><div class="stat-value" id="piInside">0</div></div></div><div class="panel center" style="margin-top:18px"><div class="stat-label">La nostra stima di π</div><div class="big-num" id="piEstimate">—</div><p class="subtle" id="piFormula">4 × (punti nel cerchio / punti totali)</p></div></section></div>`;}
function paintPi(){let c=document.getElementById('piCanvas');if(!c)return;let ctx=c.getContext('2d');ctx.clearRect(0,0,520,520);ctx.fillStyle='#fff';ctx.fillRect(0,0,520,520);ctx.beginPath();ctx.arc(260,260,260,0,Math.PI*2);ctx.fillStyle='#f0faf5';ctx.fill();ctx.strokeStyle='#148d80';ctx.lineWidth=3;ctx.stroke();state.piPoints.forEach(([x,y,inside])=>{ctx.fillStyle=inside?'#4786ce':'#fa927c';ctx.fillRect((x+1)*260-1.8,(1-y)*260-1.8,3.6,3.6);});let n=state.piPoints.length;document.getElementById('piTotal').textContent=fmt(n);document.getElementById('piInside').textContent=fmt(state.piInside);document.getElementById('piEstimate').textContent=n?(4*state.piInside/n).toFixed(5).replace('.',','):'—';}
function addPi(n){for(let i=0;i<n;i++){let x=2*Math.random()-1,y=2*Math.random()-1;let hit=x*x+y*y<=1;state.piPoints.push([x,y,hit]);if(hit)state.piInside++;}paintPi();}
function resetPi(){state.piPoints=[];state.piInside=0;paintPi();}
function piExplained(){return `${panelHeader('Esperimento 1','Perché i punti ci aiutano?','Lanciando molti punti, la percentuale di quelli nel cerchio ci suggerisce il rapporto tra le due aree.')}<div class="slide-body"><div class="steps"><div class="step"><strong>1. Lanciamo i punti</strong><p>I punti finiscono a caso dentro il quadrato.</p></div><div class="step"><strong>2. Li contiamo</strong><p>Quanti sono caduti nel cerchio?</p></div><div class="step"><strong>3. Stimiamo π</strong><p>Moltiplichiamo la frazione dei punti nel cerchio per 4.</p></div></div><div class="math" style="margin-top:28px">π ≈ 4 × <span style="display:inline-block;vertical-align:middle"><span style="display:block;border-bottom:3px solid currentColor;padding:0 6px 3px">punti nel cerchio</span><span style="display:block;padding:3px 6px 0">punti nel quadrato</span></span></div><p class="center subtle report">Il valore di π è circa <strong>3,14159…</strong></p></div>`;}
function birthdayQuestion(){return `${panelHeader('Esperimento 2','Il paradosso del compleanno','In una classe con 23 studenti, qual è la probabilità che almeno due compiano gli anni lo stesso giorno?')}<div class="slide-body"><div class="question-choices">${['Meno del 10%','Tra il 10% e il 30%','Tra il 30% e il 50%','Più del 50%'].map((text,i)=>`<button class="choice ${state.choice===i?'selected':''}" onclick="chooseAnswer(${i})">${String.fromCharCode(65+i)}. ${text}</button>`).join('')}</div><div class="choices-info" id="choicesInfo">${state.choice<0?'':`Risposta ${'ABCD'[state.choice]} selezionata`}</div></div>`;}
function chooseAnswer(i){state.choice=i;drawSlide();}
function month(day){const months=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'],lengths=[31,28,31,30,31,30,31,31,30,31,30,31];let ix=0;while(day>lengths[ix]){day-=lengths[ix];ix++;}return `${day} ${months[ix]}`;}
function simulateClass(){let values=Array.from({length:state.students},()=>1+Math.floor(Math.random()*365));let count=new Map();for(const d of values)count.set(d,(count.get(d)||0)+1);let duplicated=values.some(d=>count.get(d)>1);return {values,duplicated,count};}
function birthdayExperiment(){return `${panelHeader('Esperimento 2','Inventiamo migliaia di classi!','Ogni studente riceve un compleanno casuale. Contiamo quante classi contengono almeno una coincidenza.')}<div class="slide-body cols"><section><div class="panel"><h3>Quanti studenti ci sono nella classe?</h3><div class="controls" id="studentControls">${[10,20,23,30,40].map(n=>`<button class="secondary ${state.students===n?'active':''}" onclick="changeStudents(${n})">${n}</button>`).join('')}</div><div class="controls"><button class="primary" onclick="runBirthdays(1)">Una classe</button><button class="secondary" onclick="runBirthdays(100)">+100</button><button class="secondary" onclick="runBirthdays(1000)">+1.000</button><button class="secondary" onclick="runBirthdays(10000)">+10.000</button><button class="secondary" onclick="resetBirthdays()">Ricomincia</button></div><h3 style="margin-top:20px">L'ultima classe creata</h3><div class="month-grid" id="birthdayGrid"></div><div class="note" id="birthdayMessage"></div></div></section><section><div class="stats"><div class="stat"><div class="stat-label">Classi create</div><div class="stat-value" id="classCount">0</div></div><div class="stat"><div class="stat-label">Classi con doppioni</div><div class="stat-value" id="duplicateCount">0</div></div><div class="stat"><div class="stat-label">Coppie possibili</div><div class="stat-value" id="pairCount">253</div></div></div><div class="panel center" style="margin-top:18px"><div class="stat-label">Probabilità stimata</div><div class="big-num" id="birthdayEstimate">—</div><div class="slider-bar"><div class="slider-fill" id="birthdayBar" style="width:0"></div></div><button class="secondary" style="margin-top:16px" onclick="toggleReveal()" id="revealButton">Svela la probabilità teorica</button><div class="report" id="theoryValue" style="color:var(--teal);margin-top:10px"></div></div></section></div>`;}
function changeStudents(n){state.students=n;resetBirthdays();drawSlide();}
function runBirthdays(n){for(let i=0;i<n;i++){let res=simulateClass();state.classes++;if(res.duplicated)state.duplicateClasses++;if(i===n-1){state.birthdays=res.values;state.birthdayHit=res.duplicated;state.lastBirthCount=res.count;}}paintBirthday();}
function resetBirthdays(){state.classes=0;state.duplicateClasses=0;state.birthdays=[];state.birthdayHit=false;state.lastBirthCount=new Map();state.reveal=false;paintBirthday();}
function toggleReveal(){state.reveal=!state.reveal;paintBirthday();}
function paintBirthday(){if(state.slide!==6)return;document.getElementById('classCount').textContent=fmt(state.classes);document.getElementById('duplicateCount').textContent=fmt(state.duplicateClasses);document.getElementById('pairCount').textContent=fmt(state.students*(state.students-1)/2);document.getElementById('birthdayEstimate').textContent=state.classes?(100*state.duplicateClasses/state.classes).toFixed(1).replace('.',',')+'%':'—';document.getElementById('birthdayBar').style.width=state.classes?`${100*state.duplicateClasses/state.classes}%`:'0%';document.getElementById('birthdayGrid').innerHTML=state.birthdays.length?state.birthdays.map((d,i)=>`<div class="birthday ${(state.lastBirthCount.get(d)||0)>1?'duplicate':''}"><span class="avatar">👤</span>${month(d)}</div>`).join(''):'<p class="subtle" style="grid-column:1/-1">Premi «Una classe» per iniziare.</p>';document.getElementById('birthdayMessage').textContent=state.classes?(state.birthdayHit?'Nell’ultima classe: almeno due compleanni uguali!':'Nell’ultima classe: tutti i compleanni sono diversi.'):' ';document.getElementById('theoryValue').textContent=state.reveal?(theoretical(state.students)*100).toFixed(2).replace('.',',')+'%':'';document.getElementById('revealButton').textContent=state.reveal?'Nascondi la probabilità teorica':'Svela la probabilità teorica';}
function birthdayExplanation(){let pairs=23*22/2;return `${panelHeader('Esperimento 2','Perché 23 persone bastano?','Non cerchiamo una data precisa: cerchiamo due persone qualsiasi con lo stesso compleanno.')}<div class="slide-body cols" style="align-items:center"><div class="panel center"><div class="subtle">Con 23 studenti abbiamo</div><div class="huge-pairs">${pairs}</div><h2>coppie possibili</h2><div class="math" style="font-size:30px;margin-top:18px">23 × 22 ÷ 2 = 253</div></div><div class="panel"><h3>Quanto cresce la probabilità?</h3><table class="mini-table"><thead><tr><th>Studenti</th><th>Probabilità</th></tr></thead><tbody>${[10,20,23,30,40].map(n=>`<tr><td>${n}</td><td>${(100*theoretical(n)).toFixed(1).replace('.',',')}%</td></tr>`).join('')}</tbody></table><p class="subtle">Supponiamo 365 giorni equiprobabili e compleanni indipendenti.</p></div></div>`;}
function finalSlide(){return `${panelHeader('La sfida finale','Adesso tocca a voi!','Provate a prevedere i risultati e poi tornate alle simulazioni per verificarli.')}<div class="slide-body"><div class="challenge-grid"><div class="challenge"><div class="eyebrow">Sfida 1</div><h3>Quanto ci avviciniamo a π?</h3><p>Provate prima con 10 punti e poi con 10.000. La stima è sempre più vicina a 3,14?</p><button class="secondary" onclick="goTo(3)">Prova l’esperimento →</button></div><div class="challenge"><div class="eyebrow">Sfida 2</div><h3>Quante persone servono?</h3><p>Con 30 studenti la probabilità di trovare almeno due compleanni uguali supera il 70%?</p><button class="secondary" onclick="goTo(6)">Prova l’esperimento →</button></div></div><div class="math" style="margin-top:32px">Il caso può aiutarci a scoprire la matematica.</div></div>`;}
function goTo(i){state.slide=i;drawSlide();}
drawSlide();
</script>
</body>
</html>
