
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7fbfa">
<title>Il laboratorio del caso — L'area del cerchio</title>
<style>
:root {
  --ink:#193f3b; --muted:#637b83; --bg:#f7fbfa;
  --teal:#0b9688; --blue:#4786ce; --red:#fa927c;
  --border:#d9e8e6;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
button { cursor:pointer; font:inherit; }
.app { max-width:1500px; min-height:100vh; margin:auto; padding:18px 34px 24px; display:flex; flex-direction:column; gap:12px; }
.top,.footer { display:flex; justify-content:space-between; align-items:center; gap:16px; }
.top { padding:7px 4px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:900; }
.brand-mark { width:32px; height:32px; border-radius:11px; display:grid; place-items:center; background:#dff6ed; color:var(--teal); font-size:22px; }
.top-right,.nav-actions { display:flex; align-items:center; gap:10px; }
.counter { color:var(--muted); font-size:14px; font-weight:700; white-space:nowrap; }
.screen { background:white; border:1px solid var(--border); box-shadow:0 18px 50px #184d4714; border-radius:28px; padding:clamp(24px,3vw,46px); min-height:630px; flex:1; display:flex; flex-direction:column; }
.slide-head { margin-bottom:22px; }
.eyebrow { color:var(--teal); font-weight:900; letter-spacing:.12em; text-transform:uppercase; font-size:14px; margin:0 0 12px; }
.slide-head h1 { font-size:clamp(34px,4vw,62px); line-height:1.1; letter-spacing:-.04em; margin:0; }
.slide-head p { font-size:clamp(18px,1.5vw,23px); color:var(--muted); margin:13px 0 0; line-height:1.45; }
.slide-body { flex:1; }
.hero { display:grid; grid-template-columns:1.1fr .9fr; gap:40px; align-items:center; height:100%; }
.hero h1 { font-size:clamp(54px,6vw,90px); line-height:1.03; letter-spacing:-.055em; margin:18px 0 20px; }
.hero p { font-size:clamp(20px,1.8vw,27px); line-height:1.48; color:var(--muted); margin-bottom:30px; }
.hero-art { min-height:390px; border-radius:26px; background:linear-gradient(140deg,#f0faf8,#d9f4f1); display:grid; place-items:center; position:relative; overflow:hidden; }
.big-circle { width:min(28vw,350px); aspect-ratio:1; border:8px solid #20ac96; border-radius:50%; background:radial-gradient(circle at 30% 26%,#e9fffb 0,#beece0 85%); display:grid; place-items:center; font-size:145px; font-weight:750; color:#0e897c; }
.art-dot { position:absolute; border-radius:50%; background:#ffb649; }
.dot1 { height:26px; width:26px; top:10%; left:14%; }
.dot2 { height:18px; width:18px; bottom:14%; right:11%; }
.dot3 { height:13px; width:13px; top:23%; right:17%; }
.primary,.secondary,.navbutton { border-radius:12px; font-weight:800; }
.primary { background:var(--teal); color:white; border:none; padding:13px 25px; font-size:17px; }
.primary:hover { background:#087d73; }
.secondary { background:white; color:var(--ink); border:1px solid #c8e3de; padding:11px 17px; }
.secondary:hover { background:#e4f6f1; border-color:#84cdbf; }
.cols { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr); gap:24px; align-items:start; }
.panel { border:1px solid var(--border); border-radius:20px; background:white; padding:18px; }
.panel h3 { font-size:20px; margin:0 0 14px; }
.point-panel { background:#f7fbfa; text-align:center; }
.point-panel canvas { display:block; margin:auto; width:min(100%,490px); height:auto; border:1px solid #bfd5d0; background:white; border-radius:8px; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 18px; }
.stats { display:flex; flex-wrap:wrap; gap:12px; }
.stat { flex:1; min-width:145px; border:1px solid var(--border); border-radius:16px; background:#f9fcfb; padding:16px 20px; }
.stat-label { color:var(--muted); font-size:14px; font-weight:700; }
.stat-value { color:#154e45; font-size:clamp(24px,2.5vw,38px); font-weight:850; line-height:1.3; }
.big-num { font-size:clamp(43px,5vw,74px); font-weight:900; line-height:1.1; color:var(--teal); }
.subtle,.note { color:var(--muted); }
.note { margin-top:16px; font-size:15px; }
.center { text-align:center; }
.illustrate-circle { position:relative; width:320px; height:320px; margin:20px auto; background:#eaf5fb; border:3px solid #7a9bbb; display:grid; place-items:center; }
.illustrate-circle::before { content:""; position:absolute; inset:0; background:#b9eade; border:4px solid var(--teal); border-radius:50%; }
.illustrate-circle span { position:relative; font-weight:900; font-size:44px; color:#08796d; }
.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:17px; }
.step { border-radius:20px; background:#f0f9f6; padding:26px; min-height:200px; }
.step strong { display:block; font-size:22px; margin-bottom:14px; }
.step p { font-size:18px; line-height:1.5; color:#496964; }
.math { font-size:clamp(23px,2.6vw,36px); font-weight:850; text-align:center; background:#eaf8f4; border-radius:20px; padding:22px; color:#0c796c; }
.footer { padding:3px 6px; }
.navbutton { background:white; border:1px solid #d4e5df; padding:9px 16px; font-size:17px; color:#234f47; }
.navbutton:disabled { opacity:.3; cursor:not-allowed; }
.progress { height:7px; flex:1; max-width:400px; border-radius:20px; background:#e3efec; overflow:hidden; }
.progress-inner { height:100%; background:var(--teal); transition:width .2s; }
@media (max-width:1000px) {
 .app { padding:12px; } .screen { min-height:0; }
 .cols,.hero { grid-template-columns:1fr; }
 .hero-art { min-height:260px; } .big-circle { width:210px; font-size:90px; }
 .steps { grid-template-columns:1fr; } .slide-head h1 { font-size:36px; }
}
@media (max-width:600px) {
 .screen { padding:18px; border-radius:18px; } .app { gap:8px; }
 .cols { display:block; } .cols>* { margin-bottom:14px; }
 .stat { min-width:110px; } .stat-value { font-size:24px; }
 .hero h1 { font-size:48px; } .hero-art { display:none; }
 .top { flex-wrap:wrap; } .top-right { margin-left:auto; }
}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand"><span class="brand-mark">π</span><span>Il laboratorio del caso</span></div>
  <div class="top-right">
   <span class="counter" id="counter">1 / 4</span>
   <button class="secondary" id="fullscreen">⛶ Schermo intero</button>
  </div>
 </header>
 <main class="screen" id="screen" aria-live="polite"></main>
 <footer class="footer">
  <div class="progress"><div class="progress-inner" id="progress" style="width:25%"></div></div>
  <div class="nav-actions">
   <button class="navbutton" id="prev">← Indietro</button>
   <button class="navbutton" id="next">Avanti →</button>
  </div>
 </footer>
</div>
<script>
"use strict";
const screenEl = document.getElementById("screen");
const state = { slide:0, points:[], inside:0 };
const fmt = n => new Intl.NumberFormat("it-IT").format(n);

function panelHeader(label,title,subtitle="") {
 return `<header class="slide-head"><div class="eyebrow">${label}</div><h1>${title}</h1><p>${subtitle}</p></header>`;
}
function home() {
 return `<div class="slide-body hero">
  <section>
   <h1>Il laboratorio<br>del <span style="color:var(--teal)">caso</span></h1>
   <p>Possiamo stimare l'area di un cerchio affidandoci al caso?</p>
   <button class="primary" onclick="navigate(1)">Iniziamo →</button>
  </section>
  <div class="hero-art" aria-hidden="true"><div class="big-circle">π</div><div class="art-dot dot1"></div><div class="art-dot dot2"></div><div class="art-dot dot3"></div></div>
 </div>`;
}
function circleQuestion() {
 return `${panelHeader("Il problema","Possiamo stimare l'area del cerchio lanciando punti a caso?","Un cerchio di raggio 1 è disegnato dentro un quadrato di lato 2.")}
  <div class="slide-body cols" style="align-items:center">
   <div class="illustrate-circle"><span>π</span></div>
   <div>
    <div class="panel" style="margin-bottom:20px"><h3>Il quadrato</h3><div class="big-num" style="color:var(--blue)">Area = 4</div><p class="subtle">Lato 2 × lato 2</p></div>
    <div class="panel"><h3>Il cerchio</h3><div class="big-num">Area = π</div><p class="subtle">Per un cerchio di raggio 1</p></div>
   </div>
  </div>`;
}
function circleExperiment() {
 return `${panelHeader("La simulazione","Stimiamo l'area del cerchio con i puntini!","Ogni punto ha la stessa possibilità di cadere ovunque nel quadrato.")}
  <div class="slide-body cols">
   <section class="panel point-panel">
    <canvas id="circleCanvas" width="520" height="520" aria-label="Punti casuali nel quadrato e nel cerchio"></canvas>
    <div class="note"><span style="color:var(--blue)">●</span> Dentro il cerchio &nbsp;&nbsp; <span style="color:var(--red)">●</span> Fuori dal cerchio</div>
   </section>
   <section>
    <div class="controls">
     <button class="secondary" onclick="addPoints(10)">+10 punti</button>
     <button class="primary" onclick="addPoints(100)">+100 punti</button>
     <button class="secondary" onclick="addPoints(1000)">+1.000 punti</button>
     <button class="secondary" onclick="addPoints(10000)">+10.000 punti</button>
     <button class="secondary" onclick="resetPoints()">Ricomincia</button>
    </div>
    <div class="stats">
     <div class="stat"><div class="stat-label">Punti totali</div><div class="stat-value" id="pointTotal">0</div></div>
     <div class="stat"><div class="stat-label">Punti nel cerchio</div><div class="stat-value" id="pointInside">0</div></div>
    </div>
    <div class="panel center" style="margin-top:18px">
     <div class="stat-label">La nostra stima dell'area del cerchio (π)</div>
     <div class="big-num" id="areaEstimate">—</div>
     <p class="subtle">4 × (punti nel cerchio / punti totali)</p>
    </div>
   </section>
  </div>`;
}
function circleExplanation() {
 return `${panelHeader("Come funziona","Perché i punti ci aiutano?","Lanciando molti punti, la percentuale di quelli nel cerchio ci suggerisce il rapporto tra le due aree.")}
  <div class="slide-body">
   <div class="steps">
    <div class="step"><strong>1. Lanciamo i punti</strong><p>I punti finiscono a caso dentro il quadrato.</p></div>
    <div class="step"><strong>2. Li contiamo</strong><p>Quanti sono caduti nel cerchio?</p></div>
    <div class="step"><strong>3. Stimiamo l'area</strong><p>Moltiplichiamo la frazione dei punti nel cerchio per 4.</p></div>
   </div>
   <div class="math" style="margin-top:28px">Area del cerchio ≈ 4 × <span style="display:inline-block;vertical-align:middle"><span style="display:block;border-bottom:3px solid currentColor;padding:0 6px 3px">punti nel cerchio</span><span style="display:block;padding:3px 6px 0">punti nel quadrato</span></span></div>
   <p class="center subtle" style="font-size:23px">Per il cerchio di raggio 1, l'area è π ≈ <strong>3,14159…</strong></p>
  </div>`;
}
const slides = [home,circleQuestion,circleExperiment,circleExplanation];
function drawSlide() {
 screenEl.innerHTML = slides[state.slide]();
 document.getElementById("counter").textContent = `${state.slide+1} / ${slides.length}`;
 document.getElementById("progress").style.width = `${100*(state.slide+1)/slides.length}%`;
 document.getElementById("prev").disabled = state.slide===0;
 document.getElementById("next").disabled = state.slide===slides.length-1;
 if (state.slide===2) paintPoints();
}
function navigate(delta) {
 state.slide = Math.min(slides.length-1,Math.max(0,state.slide+delta));
 drawSlide(); window.scrollTo(0,0);
}
document.getElementById("prev").addEventListener("click",()=>navigate(-1));
document.getElementById("next").addEventListener("click",()=>navigate(1));
document.getElementById("fullscreen").addEventListener("click",()=>{
 if (document.fullscreenElement) document.exitFullscreen();
 else document.documentElement.requestFullscreen?.();
});
document.addEventListener("keydown",e=>{
 if (["ArrowRight","PageDown"].includes(e.key)) {e.preventDefault();navigate(1);}
 if (["ArrowLeft","PageUp"].includes(e.key)) {e.preventDefault();navigate(-1);}
});
function paintPoints() {
 const canvas = document.getElementById("circleCanvas");
 if (!canvas) return;
 const ctx = canvas.getContext("2d");
 ctx.clearRect(0,0,520,520);
 ctx.fillStyle = "#fff"; ctx.fillRect(0,0,520,520);
 ctx.beginPath(); ctx.arc(260,260,260,0,2*Math.PI);
 ctx.fillStyle = "#f0faf5"; ctx.fill();
 ctx.strokeStyle = "#148d80"; ctx.lineWidth = 3; ctx.stroke();
 for (const [x,y,isInside] of state.points) {
  ctx.fillStyle = isInside ? "#4786ce" : "#fa927c";
  ctx.fillRect((x+1)*260-1.8,(1-y)*260-1.8,3.6,3.6);
 }
 const n = state.points.length;
 document.getElementById("pointTotal").textContent = fmt(n);
 document.getElementById("pointInside").textContent = fmt(state.inside);
 document.getElementById("areaEstimate").textContent = n ? (4*state.inside/n).toFixed(5).replace(".",",") : "—";
}
function addPoints(n) {
 for (let i=0;i<n;i++) {
  const x = 2*Math.random()-1;
  const y = 2*Math.random()-1;
  const isInside = x*x+y*y<=1;
  state.points.push([x,y,isInside]);
  if (isInside) state.inside++;
 }
 paintPoints();
}
function resetPoints() {
 state.points = []; state.inside = 0; paintPoints();
}
drawSlide();
</script>
</body>
</html>
