
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il laboratorio del caso</title>

<style>
:root {
  --ink: #193f3b;
  --muted: #637b83;
  --bg: #f7fbfa;
  --teal: #0b9688;
  --blue: #4786ce;
  --red: #fa927c;
  --border: #d9e8e6;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

.app {
  max-width: 1500px;
  min-height: 100vh;
  margin: auto;
  padding: 18px 34px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.top, .footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.top {
  padding: 8px 4px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: bold;
  font-size: 18px;
}

.brand-mark {
  background: #dff6ed;
  color: var(--teal);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 24px;
}

.top-right, .nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.counter {
  color: var(--muted);
  font-weight: bold;
}

.screen {
  background: white;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 40px;
  min-height: 630px;
  flex: 1;
  box-shadow: 0 18px 50px #184d4714;
}

h1 {
  font-size: clamp(34px, 4vw, 60px);
  line-height: 1.12;
  letter-spacing: -1px;
  margin: 12px 0 18px;
}

h2 {
  font-size: 30px;
}

h3 {
  font-size: 20px;
}

p {
  line-height: 1.55;
}

.eyebrow {
  color: var(--teal);
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-size: 14px;
}

.subtitle {
  font-size: 22px;
  color: var(--muted);
  margin-bottom: 26px;
}

.hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  align-items: center;
  gap: 40px;
  min-height: 510px;
}

.hero h1 {
  font-size: clamp(50px, 6vw, 88px);
}

.hero p {
  font-size: 25px;
  color: var(--muted);
}

.hero-art {
  height: 400px;
  background: linear-gradient(140deg,#f0faf8,#d9f4f1);
  border-radius: 26px;
  display: grid;
  place-items: center;
}

.hero-circle {
  width: 290px;
  height: 290px;
  border-radius: 50%;
  border: 8px solid #20ac96;
  background: #beece0;
  display: grid;
  place-items: center;
  font-size: 130px;
  font-weight: bold;
  color: var(--teal);
}

.primary, .secondary, .navbutton {
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: bold;
  font-size: 17px;
}

.primary {
  background: var(--teal);
  color: white;
  border: none;
}

.primary:hover {
  background: #087d73;
}

.secondary, .navbutton {
  background: white;
  color: var(--ink);
  border: 1px solid #c8e3de;
}

.secondary:hover, .secondary.active {
  background: #e4f6f1;
  border-color: var(--teal);
}

.navbutton:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0;
}

.cols {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 25px;
}

.panel {
  padding: 20px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 20px;
}

.panel h3 {
  margin-top: 0;
}

.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.stat {
  flex: 1;
  min-width: 140px;
  border: 1px solid var(--border);
  background: #f9fcfb;
  border-radius: 16px;
  padding: 16px;
}

.stat-label {
  color: var(--muted);
  font-size: 14px;
  font-weight: bold;
}

.stat-value {
  font-size: 32px;
  font-weight: 900;
  color: #154e45;
  margin-top: 8px;
}

.big-num {
  color: var(--teal);
  font-size: clamp(44px,5vw,72px);
  font-weight: 900;
}

.center {
  text-align: center;
}

.subtle {
  color: var(--muted);
}

.big-dice {
  width: 130px;
  height: 130px;
  display: grid;
  place-items: center;
  background: #e5f7f2;
  border: 3px solid #a4d7cb;
  border-radius: 25px;
  font-size: 86px;
}

.visual-row {
  display: flex;
  gap: 25px;
  align-items: center;
}

.bar-row {
  display: grid;
  grid-template-columns: 25px 1fr 45px;
  gap: 10px;
  align-items: center;
  margin: 14px 0;
  font-weight: bold;
}

.bar-track {
  background: #edf3f1;
  border-radius: 30px;
  height: 20px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 30px;
  background: var(--teal);
}

.illustrate-circle {
  width: 320px;
  height: 320px;
  background: #b9eade;
  border: 4px solid var(--teal);
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 30px auto;
  font-size: 70px;
  font-weight: bold;
  color: #08796d;
  box-shadow: 0 0 0 3px #7a9bbb;
}

.point-panel {
  background: #f7fbfa;
  text-align: center;
}

canvas {
  width: min(100%, 490px);
  height: auto;
  background: white;
  border: 1px solid #bfd5d0;
}

.note {
  color: var(--muted);
  font-size: 15px;
  margin-top: 15px;
}

.math {
  background: #eaf8f4;
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  color: #0c796c;
  font-size: 28px;
  font-weight: bold;
}

.steps {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 18px;
}

.step {
  background: #f0f9f6;
  padding: 25px;
  border-radius: 20px;
}

.step strong {
  font-size: 22px;
}

.step p {
  font-size: 18px;
}

.question-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  max-width: 950px;
  margin: 45px auto;
}

.choice {
  background: white;
  color: var(--ink);
  border: 2px solid #d7e8e3;
  border-radius: 18px;
  padding: 28px;
  font-size: 25px;
  font-weight: bold;
  text-align: left;
}

.choice:hover, .choice.selected {
  background: #ecf9f5;
  border-color: var(--teal);
}

.choices-info {
  color: var(--teal);
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(6,1fr);
  gap: 8px;
}

.birthday {
  background: #eaf6f2;
  border: 1px solid #d2e6df;
  border-radius: 10px;
  padding: 9px 4px;
  font-size: 12px;
  text-align: center;
}

.birthday .avatar {
  display: block;
  font-size: 22px;
}

.birthday.duplicate {
  background: #fff0ba;
  border-color: #ebbd49;
  font-weight: bold;
}

.slider-bar {
  height: 20px;
  background: #e7f3ef;
  border-radius: 30px;
  overflow: hidden;
  margin: 20px 0 8px;
}

.slider-fill {
  background: var(--teal);
  height: 100%;
  width: 0;
}

.mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 19px;
}

.mini-table th, .mini-table td {
  padding: 13px;
  border-bottom: 1px solid #e3efec;
  text-align: left;
}

.mini-table td:last-child {
  text-align: right;
  font-weight: bold;
}

.huge-pairs {
  font-size: 110px;
  font-weight: 900;
  color: var(--teal);
}

.footer {
  padding: 5px;
}

.progress {
  flex: 1;
  max-width: 400px;
  height: 7px;
  background: #e3efec;
  border-radius: 20px;
  overflow: hidden;
}

.progress-inner {
  height: 100%;
  background: var(--teal);
  width: 12.5%;
}

@media(max-width:900px) {
  .app {
    padding: 12px;
  }
  .screen {
    padding: 22px;
    min-height: 0;
  }
  .hero, .cols, .steps, .question-choices {
    grid-template-columns: 1fr;
  }
  .hero-art {
    display: none;
  }
  .month-grid {
    grid-template-columns: repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="brand">
    <span class="brand-mark">π</span>
    <span>Il laboratorio del caso</span>
  </div>
  <div class="top-right">
    <span class="counter" id="counter">1 / 8</span>
    <button class="secondary" id="fullscreen">
      ⛶ Schermo intero
    </button>
  </div>
</header>

<main class="screen" id="screen"></main>

<footer class="footer">
  <div class="progress">
    <div class="progress-inner" id="progress"></div>
  </div>
  <div class="nav-actions">
    <button class="navbutton" id="prev">← Indietro</button>
    <button class="navbutton" id="next">Avanti →</button>
  </div>
</footer>

</div>

<script>
"use strict";

// DATI DELLE SIMULAZIONI

const screenEl = document.getElementById("screen");

const state = {
  slide: 0,
  dice: [0,0,0,0,0,0],
  lastDie: 1,
  piPoints: [],
  piInside: 0,
  students: 23,
  classes: 0,
  duplicateClasses: 0,
  birthdays: [],
  birthdayHit: false,
  lastBirthCount: new Map(),
  reveal: false,
  choice: -1
};

const fmt = n =>
  new Intl.NumberFormat("it-IT").format(n);

const sum = a => a.reduce((x,y) => x+y,0);

function theoretical(n) {
  let p = 1;
  for(let i=0;i<n;i++) {
    p *= (365-i)/365;
  }
  return 1-p;
}

function panelHeader(label,title,subtitle="") {
  return `
    <header>
      <div class="eyebrow">${label}</div>
      <h1>${title}</h1>
      <p class="subtitle">${subtitle}</p>
    </header>
  `;
}

// NAVIGAZIONE - 8 SLIDE

const slides = [
  home,
  diceSlide,
  piQuestion,
  piExperiment,
  piExplained,
  birthdayQuestion,
  birthdayExperiment,
  birthdayExplanation
];

function drawSlide() {
  screenEl.innerHTML = slides[state.slide]();

  document.getElementById("counter").textContent =
    `${state.slide+1} / ${slides.length}`;

  document.getElementById("progress").style.width =
    (100*(state.slide+1)/slides.length)+"%";

  document.getElementById("prev").disabled =
    state.slide===0;

  document.getElementById("next").disabled =
    state.slide===slides.length-1;

  if(state.slide===1) paintDice();
  if(state.slide===3) paintPi();
  if(state.slide===6) paintBirthday();
}

function navigate(delta) {
  state.slide = Math.max(
    0,
    Math.min(slides.length-1,state.slide+delta)
  );

  drawSlide();
  window.scrollTo(0,0);
}

document.getElementById("prev").onclick =
  () => navigate(-1);

document.getElementById("next").onclick =
  () => navigate(1);

document.getElementById("fullscreen").onclick = () => {
  if(document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
};

document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight") navigate(1);
  if(e.key==="ArrowLeft") navigate(-1);
});

// SLIDE 1 - INTRODUZIONE

function home() {
  return `
  <div class="hero">
    <section>
      <h1>
        Il laboratorio<br>
        del <span style="color:var(--teal)">caso</span>
      </h1>

      <p>
        Due sfide matematiche: stimare
        <strong>π</strong> e scoprire il
        <strong>paradosso del compleanno</strong>.
      </p>

      <button class="primary" onclick="navigate(1)">
        Iniziamo →
      </button>
    </section>

    <div class="hero-art">
      <div class="hero-circle">π</div>
    </div>
  </div>`;
}

// SLIDE 2 - DADO

function diceSlide() {
  return `
  ${panelHeader(
    "Il caso in azione",
    "Un dado, tanti lanci",
    "Che cosa succede se lanciamo un dado molte volte?"
  )}

  <div class="cols">
    <section class="panel">
      <div class="visual-row">
        <div class="big-dice" id="dieFace">⚀</div>
        <div>
          <div class="subtle">Ultimo risultato</div>
          <div class="big-num" id="dieLast">1</div>
        </div>
      </div>

      <div class="controls">
        <button class="primary" onclick="rollDice(1)">
          Lancia 1
        </button>
        <button class="secondary" onclick="rollDice(10)">
          +10 lanci
        </button>
        <button class="secondary" onclick="rollDice(100)">
          +100 lanci
        </button>
        <button class="secondary" onclick="resetDice()">
          Ricomincia
        </button>
      </div>

      <div class="stat">
        <div class="stat-label">Lanci effettuati</div>
        <div class="stat-value" id="dieTotal">0</div>
      </div>
    </section>

    <section class="panel">
      <h3>Quante volte è uscita ogni faccia?</h3>
      <div id="dieBars"></div>
    </section>
  </div>`;
}

function paintDice() {
  const faces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

  document.getElementById("dieFace").textContent =
    faces[state.lastDie-1];

  document.getElementById("dieLast").textContent =
    state.lastDie;

  let total = sum(state.dice);

  document.getElementById("dieTotal").textContent =
    fmt(total);

  document.getElementById("dieBars").innerHTML =
    state.dice.map((n,i) => `
      <div class="bar-row">
        <span>${i+1}</span>
        <div class="bar-track">
          <div class="bar-fill"
            style="width:${total?100*n/total:0}%">
          </div>
        </div>
        <span>${n}</span>
      </div>
    `).join("");
}

function rollDice(n) {
  for(let i=0;i<n;i++) {
    state.lastDie = 1+Math.floor(Math.random()*6);
    state.dice[state.lastDie-1]++;
  }
  paintDice();
}

function resetDice() {
  state.dice = [0,0,0,0,0,0];
  state.lastDie = 1;
  paintDice();
}

// SLIDE 3 - INTRODUZIONE A PI GRECO

function piQuestion() {
  return `
  ${panelHeader(
    "Esperimento 1",
    "Possiamo stimare π lanciando punti a caso?",
    "Un cerchio di raggio 1 è disegnato dentro un quadrato di lato 2."
  )}

  <div class="cols" style="align-items:center">
    <div style="background:#eaf5fb;padding:25px">
      <div class="illustrate-circle">π</div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:20px">
        <h3>Il quadrato</h3>
        <div class="big-num" style="color:var(--blue)">
          Area = 4
        </div>
        <p class="subtle">Lato 2 × lato 2</p>
      </div>

      <div class="panel">
        <h3>Il cerchio</h3>
        <div class="big-num">Area = π</div>
        <p class="subtle">Per un cerchio di raggio 1</p>
      </div>
    </div>
  </div>`;
}

// SLIDE 4 - SIMULAZIONE MONTE CARLO

function piExperiment() {
  return `
  ${panelHeader(
    "Esperimento 1",
    "Stimiamo π con i puntini!",
    "Ogni punto ha la stessa possibilità di cadere ovunque nel quadrato."
  )}

  <div class="cols">
    <section class="panel point-panel">
      <canvas id="piCanvas"
        width="520" height="520"></canvas>

      <div class="note">
        <span style="color:var(--blue)">●</span>
        Dentro il cerchio &nbsp;&nbsp;
        <span style="color:var(--red)">●</span>
        Fuori dal cerchio
      </div>
    </section>

    <section>
      <div class="controls">
        <button class="secondary" onclick="addPi(10)">
          +10 punti
        </button>
        <button class="primary" onclick="addPi(100)">
          +100 punti
        </button>
        <button class="secondary" onclick="addPi(1000)">
          +1.000 punti
        </button>
        <button class="secondary" onclick="addPi(10000)">
          +10.000 punti
        </button>
        <button class="secondary" onclick="resetPi()">
          Ricomincia
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Punti totali</div>
          <div class="stat-value" id="piTotal">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Punti nel cerchio</div>
          <div class="stat-value" id="piInside">0</div>
        </div>
      </div>

      <div class="panel center" style="margin-top:18px">
        <div class="stat-label">La nostra stima di π</div>
        <div class="big-num" id="piEstimate">—</div>
        <p class="subtle">
          4 × (punti nel cerchio / punti totali)
        </p>
      </div>
    </section>
  </div>`;
}

function paintPi() {
  const canvas = document.getElementById("piCanvas");
  if(!canvas) return;

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0,0,520,520);
  ctx.fillStyle = "white";
  ctx.fillRect(0,0,520,520);

  ctx.beginPath();
  ctx.arc(260,260,260,0,2*Math.PI);
  ctx.fillStyle = "#f0faf5";
  ctx.fill();
  ctx.strokeStyle = "#148d80";
  ctx.lineWidth = 3;
  ctx.stroke();

  for(const [x,y,inside] of state.piPoints) {
    ctx.fillStyle = inside?"#4786ce":"#fa927c";
    ctx.fillRect(
      (x+1)*260-1.8,
      (1-y)*260-1.8,
      3.6,3.6
    );
  }

  const n = state.piPoints.length;

  document.getElementById("piTotal").textContent = fmt(n);
  document.getElementById("piInside").textContent =
    fmt(state.piInside);

  document.getElementById("piEstimate").textContent =
    n?(4*state.piInside/n).toFixed(5).replace(".",","):"—";
}

function addPi(n) {
  for(let i=0;i<n;i++) {
    const x = 2*Math.random()-1;
    const y = 2*Math.random()-1;
    const inside = x*x+y*y<=1;

    state.piPoints.push([x,y,inside]);

    if(inside) state.piInside++;
  }

  paintPi();
}

function resetPi() {
  state.piPoints = [];
  state.piInside = 0;
  paintPi();
}

// SLIDE 5 - SPIEGAZIONE DI PI GRECO

function piExplained() {
  return `
  ${panelHeader(
    "Esperimento 1",
    "Perché i punti ci aiutano?",
    "Lanciando molti punti, la percentuale di quelli nel cerchio ci suggerisce il rapporto tra le due aree."
  )}

  <div class="steps">
    <div class="step">
      <strong>1. Lanciamo i punti</strong>
      <p>I punti finiscono a caso dentro il quadrato.</p>
    </div>

    <div class="step">
      <strong>2. Li contiamo</strong>
      <p>Quanti sono caduti nel cerchio?</p>
    </div>

    <div class="step">
      <strong>3. Stimiamo π</strong>
      <p>Moltiplichiamo la frazione dei punti nel cerchio per 4.</p>
    </div>
  </div>

  <div class="math" style="margin-top:28px">
    π ≈ 4 ×
    (punti nel cerchio / punti nel quadrato)
  </div>

  <p class="center subtitle">
    Il valore di π è circa <strong>3,14159…</strong>
  </p>`;
}

// SLIDE 6 - PARADOSSO DEL COMPLEANNO

function birthdayQuestion() {
  const answers = [
    "Meno del 10%",
    "Tra il 10% e il 30%",
    "Tra il 30% e il 50%",
    "Più del 50%"
  ];

  return `
  ${panelHeader(
    "Esperimento 2",
    "Il paradosso del compleanno",
    "In una classe con 23 studenti, qual è la probabilità che almeno due compiano gli anni lo stesso giorno?"
  )}

  <div class="question-choices">
    ${answers.map((answer,i)=>`
      <button
        class="choice ${state.choice===i?"selected":""}"
        onclick="chooseAnswer(${i})">
        ${"ABCD"[i]}. ${answer}
      </button>
    `).join("")}
  </div>

  <div class="choices-info">
    ${state.choice>=0?
      "Risposta "+ "ABCD"[state.choice]+" selezionata":""}
  </div>`;
}

function chooseAnswer(i) {
  state.choice = i;
  drawSlide();
}

// DATE DEI COMPLEANNI

function month(day) {
  const months = [
    "Gen","Feb","Mar","Apr","Mag","Giu",
    "Lug","Ago","Set","Ott","Nov","Dic"
  ];

  const lengths = [31,28,31,30,31,30,31,31,30,31,30,31];

  let i=0;
  while(day>lengths[i]) {
    day-=lengths[i];
    i++;
  }

  return day+" "+months[i];
}

function simulateClass() {
  const values = Array.from(
    {length:state.students},
    ()=>1+Math.floor(Math.random()*365)
  );

  const count = new Map();

  for(const d of values) {
    count.set(d,(count.get(d)||0)+1);
  }

  const duplicated = values.some(d=>count.get(d)>1);

  return {values,duplicated,count};
}

// SLIDE 7 - SIMULAZIONE COMPLEANNI

function birthdayExperiment() {
  const students = [10,20,23,30,40];

  return `
  ${panelHeader(
    "Esperimento 2",
    "Inventiamo migliaia di classi!",
    "Ogni studente riceve un compleanno casuale. Contiamo quante classi contengono almeno una coincidenza."
  )}

  <div class="cols">
    <section class="panel">
      <h3>Quanti studenti ci sono nella classe?</h3>

      <div class="controls">
        ${students.map(n=>`
          <button
            class="secondary ${state.students===n?"active":""}"
            onclick="changeStudents(${n})">
            ${n}
          </button>
        `).join("")}
      </div>

      <div class="controls">
        <button class="primary" onclick="runBirthdays(1)">
          Una classe
        </button>
        <button class="secondary" onclick="runBirthdays(100)">
          +100
        </button>
        <button class="secondary" onclick="runBirthdays(1000)">
          +1.000
        </button>
        <button class="secondary" onclick="runBirthdays(10000)">
          +10.000
        </button>
        <button class="secondary" onclick="resetBirthdays()">
          Ricomincia
        </button>
      </div>

      <h3>L'ultima classe creata</h3>
      <div class="month-grid" id="birthdayGrid"></div>
      <div class="note" id="birthdayMessage"></div>
    </section>

    <section>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Classi create</div>
          <div class="stat-value" id="classCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Classi con doppioni</div>
          <div class="stat-value" id="duplicateCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Coppie possibili</div>
          <div class="stat-value" id="pairCount">253</div>
        </div>
      </div>

      <div class="panel center" style="margin-top:18px">
        <div class="stat-label">Probabilità stimata</div>
        <div class="big-num" id="birthdayEstimate">—</div>

        <div class="slider-bar">
          <div class="slider-fill" id="birthdayBar"></div>
        </div>

        <button class="secondary"
          onclick="toggleReveal()"
          id="revealButton">
          Svela la probabilità teorica
        </button>

        <div class="subtitle" id="theoryValue"></div>
      </div>
    </section>
  </div>`;
}

function changeStudents(n) {
  state.students = n;
  state.classes = 0;
  state.duplicateClasses = 0;
  state.birthdays = [];
  state.birthdayHit = false;
  state.lastBirthCount = new Map();
  state.reveal = false;
  drawSlide();
}

function runBirthdays(n) {
  for(let i=0;i<n;i++) {
    const res = simulateClass();

    state.classes++;

    if(res.duplicated) state.duplicateClasses++;

    if(i===n-1) {
      state.birthdays = res.values;
      state.birthdayHit = res.duplicated;
      state.lastBirthCount = res.count;
    }
  }

  paintBirthday();
}

function resetBirthdays() {
  state.classes = 0;
  state.duplicateClasses = 0;
  state.birthdays = [];
  state.birthdayHit = false;
  state.lastBirthCount = new Map();
  state.reveal = false;

  paintBirthday();
}

function toggleReveal() {
  state.reveal = !state.reveal;
  paintBirthday();
}

function paintBirthday() {
  if(state.slide!==6) return;

  document.getElementById("classCount").textContent =
    fmt(state.classes);

  document.getElementById("duplicateCount").textContent =
    fmt(state.duplicateClasses);

  document.getElementById("pairCount").textContent =
    fmt(state.students*(state.students-1)/2);

  const p = state.classes?
    100*state.duplicateClasses/state.classes:0;

  document.getElementById("birthdayEstimate").textContent =
    state.classes?p.toFixed(1).replace(".",",")+"%":"—";

  document.getElementById("birthdayBar").style.width =
    p+"%";

  document.getElementById("birthdayGrid").innerHTML =
    state.birthdays.length?
    state.birthdays.map(d=>`
      <div class="birthday ${
        state.lastBirthCount.get(d)>1?"duplicate":""}">
        <span class="avatar">👤</span>
        ${month(d)}
      </div>
    `).join(""):
    '<p class="subtle">Premi «Una classe» per iniziare.</p>';

  document.getElementById("birthdayMessage").textContent =
    state.classes?
    (state.birthdayHit?
      "Nell'ultima classe: almeno due compleanni uguali!":
      "Nell'ultima classe: tutti i compleanni sono diversi."):
    "";

  document.getElementById("theoryValue").textContent =
    state.reveal?
    (100*theoretical(state.students))
      .toFixed(2).replace(".",",")+"%":
    "";

  document.getElementById("revealButton").textContent =
    state.reveal?
    "Nascondi la probabilità teorica":
    "Svela la probabilità teorica";
}
